; Teste mínimo de USB HID Gamepad no ESP32-S3 (Dingyimei S3 Zero / SuperMini).
; Board customizado copiado do projeto ESP-SimHub: 4MB flash + 2MB PSRAM quad,
; partições default.csv (4MB). Usar o esp32-s3-devkitc-1 (8MB) causava BOOT LOOP.
[env:esp32s3-supermini]
platform  = espressif32@^6.9
board     = esp32-s3-fh4r2
framework = arduino

; O board traz "-DARDUINO_USB_MODE=1" (USB-Serial-JTAG, que NÃO faz HID).
; Substituímos a lista para forçar USB-OTG/TinyUSB, único modo com HID.
board_build.extra_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; BOARD_HAS_PSRAM: o board esp32-s3-fh4r2 usa memory_type=qio_qspi, que
; configura o SPI para flash + PSRAM. Sem declarar a PSRAM, a leitura de volta
; da flash na verificacao do OTA falhava com "Flash Read Failed" (a
; transferencia chegava a 100% e so entao quebrava). O env equivalente do
; projeto ESP-SimHub, que funciona, declara esta flag.
;
; USB_PRODUCT/USB_MANUFACTURER: sem essas duas flags, o core Arduino-ESP32
; usa como iProduct a macro ARDUINO_BOARD (cores/esp32/USB.cpp:
; "#ifndef USB_PRODUCT #define USB_PRODUCT ARDUINO_BOARD"), que por sua vez
; e o campo "name" do boards/esp32-s3-fh4r2.json injetado automaticamente
; pelo build (confirmado no compile_commands.json). E por isso que o joy.cpl
; mostrava "ESP32-S3-FH4R2 (Dingyimei S3 Zero)" — metadado interno de build
; vazando pro descritor USB, nao cache do Windows. Mesmo padrao ja usado no
; env wroom1-n8r8-wheel do projeto ESP-SimHub.
build_flags =
    -DBOARD_HAS_PSRAM
    -DUSB_PRODUCT=\"ESP32S3-SimHub-ButtonBox\"
    -DUSB_MANUFACTURER=\"SimRacing_DIY\"
    ; include/ nao e visivel por padrao pras libs privadas (so pro src/) —
    ; precisa disso pra lib/inputs enxergar include/board_config.h.
    -I include

monitor_speed    = 115200
; 115200 DE PROPOSITO (padrao do PlatformIO e 460800): sobre o CDC do TinyUSB
; o handshake do esptool falha em velocidade alta — era o "No serial data
; received" que me obrigava a segurar o BOOT. Mesmo valor que o env com HID
; do projeto ESP-SimHub, que grava sem tocar no botao.
upload_speed     = 115200
; Acha a porta pelo MAC da placa, sem depender de qual /dev/cu.* calhou.
custom_expected_mac = AC276ECCFAB8
extra_scripts    = pre:scripts/enter_bootloader.py
build_src_filter = +<main.cpp>

lib_deps =
    tzapu/WiFiManager @ ^2.0.17


; -------------------------------------------------------------------
; Env de DIAGNOSTICO: USB-Serial-JTAG (MODE=1), imprime "alive N".
; -------------------------------------------------------------------
[env:diag]
platform  = espressif32@^6.9
board     = esp32-s3-fh4r2
framework = arduino
board_build.extra_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed    = 115200
build_src_filter = +<diag.cpp>


; -------------------------------------------------------------------
; Env de TESTE ISOLADO do driver MCP23017 + camada input_expander.
; Sem HID/encoders/74HC4067/SimHub/LEDs/WiFi/OTA — só valida o expansor
; de I/O entrada por entrada via serial. USB-Serial-JTAG (MODE=1), mesmo
; padrao do [env:diag]: mais simples e suficiente pra este teste.
; lib/mcp23017 e lib/input_expander sao pegos automaticamente pela LDF
; (PlatformIO Library Dependency Finder) por causa do #include em
; mcp_test.cpp — nao precisam entrar no build_src_filter.
; -------------------------------------------------------------------
[env:mcp-test]
platform  = espressif32@^6.9
board     = esp32-s3-fh4r2
framework = arduino
board_build.extra_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed    = 115200
build_src_filter = +<mcp_test.cpp>


; -------------------------------------------------------------------
; Env de TESTE ISOLADO do driver 74HC4067 (mux4067).
; Sem HID/CDC-produto/WiFi/OTA/MCP23017/encoders/LEDs — só valida o mux
; canal por canal via serial. USB-Serial-JTAG (MODE=1), mesmo padrao dos
; outros envs de teste. lib/mux4067 e pego automaticamente pela LDF por
; causa do #include em mux_test.cpp.
; -------------------------------------------------------------------
[env:mux-test]
platform  = espressif32@^6.9
board     = esp32-s3-fh4r2
framework = arduino
board_build.extra_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed    = 115200
build_src_filter = +<mux_test.cpp>


; -------------------------------------------------------------------
; Env de TESTE ISOLADO dos 4 encoders KY-040 (decoder de quadratura).
; Sem botoes/MCP23017/74HC4067/SimHub/LEDs/WiFi/OTA — só valida CW/CCW e
; posicao acumulada via serial. USB-Serial-JTAG (MODE=1), mesmo padrao dos
; outros envs de teste. lib/encoders e pego automaticamente pela LDF por
; causa do #include em encoder_test.cpp.
; -------------------------------------------------------------------
[env:encoder-test]
platform  = espressif32@^6.9
board     = esp32-s3-fh4r2
framework = arduino
board_build.extra_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed    = 115200
build_src_filter = +<encoder_test.cpp>


; -------------------------------------------------------------------
; Env de TESTE ISOLADO da camada unificada de INPUTS (lib/inputs).
; Usa só a API logica INPUT_* — nunca MCP23017/74HC4067/encoder direto.
; Sem HID/CDC especial/WiFi/OTA/SimHub/LEDs. USB-Serial-JTAG (MODE=1),
; mesmo padrao dos outros envs de teste. lib/inputs (e, transitivamente,
; lib/input_expander, lib/mux4067, lib/encoders) sao pegos pela LDF por
; causa do #include em inputs_test.cpp.
; -------------------------------------------------------------------
[env:inputs-test]
platform  = espressif32@^6.9
board     = esp32-s3-fh4r2
framework = arduino
board_build.extra_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags      = -I include ; lib/inputs inclui include/board_config.h
monitor_speed    = 115200
build_src_filter = +<inputs_test.cpp>


; -------------------------------------------------------------------
; Env de TESTE ISOLADO do protocolo SimHub Standard Serial (lib/simhub).
; Sem HID/inputs/MCP23017/74HC4067/encoders/WiFi/OTA — só valida o parser
; do protocolo. USB NATIVO (MODE=0, igual a producao, DIFERENTE dos outros
; envs de teste que usam USB-Serial-JTAG) porque o objetivo aqui e testar
; a MESMA pilha de CDC que o firmware real usa. lib/simhub e pego
; automaticamente pela LDF por causa do #include em simhub_test.cpp.
; -------------------------------------------------------------------
[env:simhub-test]
platform  = espressif32@^6.9
board     = esp32-s3-fh4r2
framework = arduino
board_build.extra_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DBOARD_HAS_PSRAM
monitor_speed    = 115200
upload_speed     = 115200
custom_expected_mac = AC276ECCFAB8
extra_scripts    = pre:scripts/enter_bootloader.py
build_src_filter = +<simhub_test.cpp>


; -------------------------------------------------------------------
; Env de TESTE ISOLADO do driver WS2812 (lib/ws2812).
; Sem HID/inputs/MCP23017/74HC4067/encoders/SimHub/WiFi/OTA — so varre
; cores na fita/matriz. USB-Serial-JTAG (MODE=1), mesmo padrao dos demais
; testes isolados (nao precisa da CDC nativa aqui). lib/ws2812 e pego
; automaticamente pela LDF por causa do #include em ws2812_test.cpp.
; -------------------------------------------------------------------
[env:ws2812-test]
platform  = espressif32@^6.9
board     = esp32-s3-fh4r2
framework = arduino
board_build.extra_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed    = 115200
build_src_filter = +<ws2812_test.cpp>


; -------------------------------------------------------------------
; Gravação por WiFi (OTA) — sem tocar no cabo nem no botão BOOT.
; O IP é descoberto pelo MAC da placa (script), então não depende de IP
; fixo nem de mDNS (o espota não resolve .local).
; -------------------------------------------------------------------
[env:ota]
extends           = env:esp32s3-supermini
upload_protocol   = espota
upload_port       = esp32s3-buttonbox.local
custom_board_mac  = ac:27:6e:cc:fa:b8
extra_scripts     = pre:scripts/ota_port_by_mac.py
